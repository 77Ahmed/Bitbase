# Render Blueprint — Dashboard → New → Blueprint → pick this repo
services:
  - type: web
    name: bitbase
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SHORTCUT_KEY        # secret for the iPhone Shortcut (Render makes a random one)
        generateValue: true
      - key: YOUTUBE_COOKIES     # optional: paste cookies.txt contents if YouTube blocks the server
        sync: false
